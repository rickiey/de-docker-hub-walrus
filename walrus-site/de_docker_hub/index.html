<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>De Docker hub</title>
        <link rel="stylesheet" href="./style.css" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <div class="flex flex-row min-h-screen">
            <!-- sidebar -->
            <aside class="basis-1/3 ps-1 bg-slate-50 flex flex-col gap-4">
                <section class="p-6 bg-white flex items-center gap-4">
                    <img class="size-16" src="./assets/docker.svg" alt="docker Logo" />
                    <div>
                        <h1 class="text-4xl text-sky-500">de-docker-hub-walrus</h1>
                        <p class="text-slate-500">Decentralized docker hub on walrus</p>
                    </div>
                </section>
                <section class="p-6 flex items-center gap-2">
                    <img src="./assets/github.svg" class="size-6" alt="GitHub Logo" />
                    <span class="text-sky-500">repo:</span>
                    <a
                        class="text-sky-900 underline underline-offset-2"
                        href="https://github.com/rickiey/de-docker-hub-walrus"
                        target="_blank"
                        rel="noopener"
                    >de-docker-hub-walrus</a>
                </section>
                <section class="p-6 flex items-center gap-2">
                    <span>testnet-package:</span>
                    <a
                        class="text-xs text-fuchsia-950 underline underline-offset-2"
                        href="https://suiscan.xyz/testnet/object/0xdd6fc2818ec29b9506dcd3e49952b28ce89f44f1ddfc8450680346f22f3e78ea/txs"
                        target="_blank"
                        rel="noopener"
                    >
                        <code>0xdd6fc2818ec29b9506dcd3e49952b28ce89f44f1ddfc8450680346f22f3e78ea</code>
                    </a>
                </section>
                <section class="p-6">
                    <h3>
                        upload your docker image
                        <a
                            class="text-sky-600 underline underline-offset-2"
                            href="https://github.com/rickiey/de-docker-hub-walrus"
                            target="_blank"
                            rel="noopener"
                        >Guides</a>
                    </h3>
                </section>
            </aside>
            <!-- main -->
            <main class="basis-2/3 ps-8 py-6">
                <div class="rounded-3xl outline-4 relative flex flex-col min-h-screen justify-center mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
                    <h2 class="text-4xl text-sky-500 mb-8">Search Docker image</h2>
                    <div class="flex gap-4 mb-8">
                        <input
                            class="rounded-3xl outline-2 border-2 px-4 py-2 flex-1"
                            type="text"
                            id="search-input"
                            placeholder="Enter search docker image"
                        />
                        <button
                            id="search-button"
                            class="rounded-3xl outline-2 border-2 px-4 py-2 bg-sky-500 text-white hover:bg-sky-600"
                        >
                            Search
                        </button>
                    </div>
                    <div id="results"></div>
                </div>
            </main>
        </div>
        <script src="./app.js"></script>
    </body>
</html>
